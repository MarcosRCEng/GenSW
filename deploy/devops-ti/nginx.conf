geo $gensw_ingress_peer {
    default 0;
    172.30.77.1 1;
}

geo $http_x_forwarded_for $gensw_tailnet_client {
    default 0;
    100.64.0.0/10 1;
    fd7a:115c:a1e0::/48 1;
}

# Serve overwrites both headers. Honour them only on the host-side hop.
map "$gensw_ingress_peer:$gensw_tailnet_client:$http_x_forwarded_proto" $gensw_client_ip {
    default $remote_addr;
    "1:1:https" $http_x_forwarded_for;
}

map "$gensw_ingress_peer:$gensw_tailnet_client:$http_x_forwarded_proto" $gensw_scheme {
    default $scheme;
    "1:1:https" https;
}

# Cookies are shared across ports on a hostname. Only GenSW's cookie goes upstream.
map $http_cookie $gensw_auth_cookie {
    default "";
    "~(?:^|;\s*)(?<gensw_refresh_cookie>GenSW\.RefreshSession=[^;]+)" $gensw_refresh_cookie;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 6m;

    # Resolve again when Compose replaces the API container.
    resolver 127.0.0.11 valid=5s ipv6=off;

    location ~ ^/api(?:/|$) {
        set $backend api:8080;
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-For $gensw_client_ip;
        proxy_set_header X-Forwarded-Proto $gensw_scheme;
        proxy_set_header Cookie $gensw_auth_cookie;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
